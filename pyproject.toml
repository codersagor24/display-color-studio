[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "display-color-studio"
version = "2.1.0"
authors = [
  { name="ab sagor", email="codersagor24@users.noreply.github.com" },
]
description = "Professional Display Calibration & Color Profile Management for Linux Wayland"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Gnome",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
display-color-studio = "display_color_studio.cli:main"

[project.urls]
"Homepage" = "https://github.com/codersagor24/display-color-studio"
"Bug Tracker" = "https://github.com/codersagor24/display-color-studio/issues"
