<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Display Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>

    <!-- Screen Glow / Spectrum Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <!-- Calibrator Arc 1: Warm Amber to Gold -->
    <linearGradient id="warmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fdffb6"/>
    </linearGradient>

    <!-- Calibrator Arc 2: Daylight White to Cool Cyan -->
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#8ecae6"/>
      <stop offset="100%" stop-color="#219ebc"/>
    </linearGradient>

    <!-- Spectrum Ring Gradient -->
    <radialGradient id="prismGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#cba6f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>

    <!-- Stand Gradient -->
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#45475a"/>
      <stop offset="100%" stop-color="#313244"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient Glow Behind Monitor -->
  <circle cx="256" cy="220" r="140" fill="url(#prismGlow)"/>

  <!-- Monitor Stand Base -->
  <ellipse cx="256" cy="425" rx="90" ry="16" fill="url(#standGrad)"/>
  <path d="M242,320 L270,320 L276,420 L236,420 Z" fill="url(#standGrad)"/>

  <!-- Monitor Bezel Outer -->
  <rect x="64" y="70" width="384" height="256" rx="20" fill="url(#bezelGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Monitor Display Screen -->
  <rect x="76" y="82" width="360" height="232" rx="12" fill="url(#screenGrad)"/>

  <!-- Screen Content: Calibration Spectrum Wave & Lens -->
  <!-- Subtle Grid Lines -->
  <path d="M76,140 L436,140 M76,198 L436,198 M76,256 L436,256" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M166,82 L166,314 M256,82 L256,314 M346,82 L346,314" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Color Wheel / Aperture -->
  <!-- Red arc -->
  <path d="M256,125 A75,75 0 0,1 326,170" fill="none" stroke="#f38ba8" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Amber/Gold warm arc -->
  <path d="M326,170 A75,75 0 0,1 320,245" fill="none" stroke="url(#warmGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Green arc -->
  <path d="M320,245 A75,75 0 0,1 240,274" fill="none" stroke="#a6e3a1" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Cyan/Cool blue arc -->
  <path d="M240,274 A75,75 0 0,1 185,225" fill="none" stroke="url(#coolGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Sapphire/Violet arc -->
  <path d="M185,225 A75,75 0 0,1 256,125" fill="none" stroke="#cba6f7" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Reference Optical Prism Lens -->
  <circle cx="256" cy="198" r="42" fill="#181825" stroke="#89b4fa" stroke-width="3"/>
  <circle cx="256" cy="198" r="30" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3,3" stroke-width="2"/>
  <circle cx="256" cy="198" r="14" fill="#ffffff" filter="url(#glow)"/>

  <!-- Crosshair Guides for Calibration Target -->
  <line x1="256" y1="140" x2="256" y2="158" stroke="#89b4fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="238" x2="256" y2="256" stroke="#89b4fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="198" y1="198" x2="216" y2="198" stroke="#89b4fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="296" y1="198" x2="314" y2="198" stroke="#89b4fa" stroke-width="3" stroke-linecap="round"/>

  <!-- Lower Monitor Chin Indicator -->
  <circle cx="256" cy="308" r="3" fill="#89b4fa"/>
</svg>
